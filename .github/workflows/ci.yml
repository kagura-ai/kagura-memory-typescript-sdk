name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The same suite with globalThis.crypto removed, i.e. Node 18's world
      # (#28). age-encryption reaches @noble, which reads
      # crypto.getRandomValues, so encrypt and keygen broke there while
      # decrypt kept working — an asymmetry only one leg of this matrix could
      # see. Running it everywhere means the next such regression fails on
      # whichever leg finishes first, and reproduces locally.
      - run: npm run test:no-webcrypto
      - run: npm run build
      - name: Pack and install smoke test
        shell: bash
        run: |
          npm pack
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/kagura-memory-*.tgz
          node -e "const { KaguraClient } = require('kagura-memory'); if (typeof KaguraClient !== 'function') process.exit(1);"
          node --input-type=module -e "import { KaguraClient } from 'kagura-memory'; if (typeof KaguraClient !== 'function') process.exit(1);"

      # The `kagura-memory` bin, launched the way a user launches it — through
      # the symlink npm installs, not `node dist/cli.js`. That path depends on
      # the shebang banner and the manifest's `bin` entry, neither of which any
      # vitest test can observe.
      #
      # HOME is redirected so nothing here can read or write a real
      # ~/.kagura/credentials.json.
      - name: CLI smoke test
        shell: bash
        run: |
          cd /tmp/smoke
          mkdir -p fakehome
          export HOME="$PWD/fakehome"
          CLI=./node_modules/.bin/kagura-memory

          "$CLI" --version | grep -qE '^kagura-memory, version [0-9]+\.[0-9]+\.[0-9]+$'
          # Every group must be reachable from the root listing.
          for cmd in auth config context contexts doctor edge explore files \
                     forget recall reference remember resource secret setup \
                     sleep update-memory; do
            "$CLI" --help | grep -qE "^  $cmd( |$)" || { echo "missing: $cmd" >&2; exit 1; }
          done
          # Nested groups resolve three levels deep.
          "$CLI" resource tokens --help | grep -q 'resource tokens'

          # Exit codes, which are the contract scripts depend on. `set -e` is
          # on, so each non-zero case is captured rather than aborting.
          code=0; "$CLI" >/dev/null 2>&1 || code=$?
          test "$code" = "2" || { echo "bare invocation: want 2, got $code" >&2; exit 1; }
          code=0; "$CLI" frobnicate >/dev/null 2>&1 || code=$?
          test "$code" = "2" || { echo "unknown command: want 2, got $code" >&2; exit 1; }
          code=0; "$CLI" recall >/dev/null 2>&1 || code=$?
          test "$code" = "2" || { echo "missing argument: want 2, got $code" >&2; exit 1; }
          code=0; "$CLI" recall hello >/dev/null 2>&1 || code=$?
          test "$code" = "1" || { echo "no credentials: want 1, got $code" >&2; exit 1; }

          # Without the optional peer, `secret` must name the install command
          # rather than crash on a missing module.
          #
          # This step runs BEFORE the one that installs age-encryption. If it
          # is ever reordered, keygen would succeed and print a real private
          # key into the build log, so that is asserted against rather than
          # assumed — a check that depends on step order should say so.
          out=$("$CLI" secret keygen --no-register 2>&1 || true)
          echo "$out" | grep -q 'age-encryption'
          if echo "$out" | grep -q 'AGE-SECRET-KEY-1'; then
            echo "a private key reached the build log; this step must run before age-encryption is installed" >&2
            exit 1
          fi

      # The optional `age-encryption` peer dependency (#28) must stay
      # optional: a bare install has to keep working, and the crypto path has
      # to work once the user opts in. Both are properties of the *published*
      # artifact, so they are checked here rather than in vitest.
      - name: Optional peer dependency stays optional
        shell: bash
        run: |
          cd /tmp/smoke
          # npm must not have pulled the peer in on its own — zero runtime
          # dependencies is a documented promise, not a default.
          test ! -d node_modules/age-encryption
          node -e "
            const { encrypt, fingerprint, SecretClient } = require('kagura-memory');
            // Everything that does not need the crypto package still works.
            if (fingerprint('age1x').length !== 64) process.exit(1);
            if (typeof SecretClient !== 'function') process.exit(1);
            // Well-formed shape, so validation passes and the call actually
            // reaches the lazy loader — that is what is under test.
            encrypt(new Uint8Array([1]), ['age1' + 'q'.repeat(30)]).then(
              () => { console.error('expected a crypto error'); process.exit(1); },
              (e) => {
                if (!/npm install age-encryption/.test(e.message)) {
                  console.error('unhelpful error:', e.message); process.exit(1);
                }
                console.log('bare install: actionable error OK');
              },
            );
          "

      - name: Crypto round-trip once the peer is installed
        shell: bash
        run: |
          cd /tmp/smoke
          # Pinned to the declared peer range. Unpinned, npm resolves
          # `latest`, and the first minor outside ^0.3.0 would hard-fail this
          # step on every PR — npm validates an optional peer strictly once
          # the package is actually present.
          npm install 'age-encryption@^0.3.0'
          # ESM-only dependency reached from the CJS bundle via a native
          # dynamic import(). An esbuild change that rewrote it to require()
          # would throw ERR_REQUIRE_ESM here and nowhere else.
          node -e "
            const sdk = require('kagura-memory');
            (async () => {
              const { identity, recipient } = await sdk.generateKeypair();
              const armored = await sdk.encrypt(Buffer.from('cjs'), [recipient]);
              const out = await sdk.decrypt(armored, identity);
              if (Buffer.from(out).toString() !== 'cjs') process.exit(1);
              console.log('cjs crypto round-trip OK');
            })().catch((e) => { console.error(e); process.exit(1); });
          "
          node --input-type=module -e "
            import { generateKeypair, encrypt, decrypt } from 'kagura-memory';
            const { identity, recipient } = await generateKeypair();
            const armored = await encrypt(Buffer.from('esm'), [recipient]);
            if (Buffer.from(await decrypt(armored, identity)).toString() !== 'esm') process.exit(1);
            console.log('esm crypto round-trip OK');
          "
