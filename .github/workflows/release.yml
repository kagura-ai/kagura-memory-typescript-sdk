name: Release

# Publishes to npm from CI so a release never depends on someone being at a
# terminal with a live `npm login`. Two triggers:
#
#   - pushing a `v*` tag, the normal path;
#   - `workflow_dispatch` with a version, for a tag that already exists and
#     was not published (which is exactly how v0.7.0 ended up: tagged and
#     released on GitHub, but the local npm token had expired).
#
# Authentication is npm **trusted publishing** (OIDC): npm trusts this
# repository and workflow directly, so there is no token to store, rotate,
# or have expire. Configured on npmjs.com under the package's Settings →
# Trusted Publisher, naming this repo and `release.yml`.
#
# It replaced `NPM_TOKEN`, which failed every attempt with `EOTP`: the
# package's publishing-access setting exempts only a *granular* token with
# 2FA-bypass, and a classic automation token does not qualify. Chasing the
# right token type would have left a credential that still expires; this
# removes the credential.
#
# Two consequences for the steps below:
#
#   - npm must be **>= 11.5.1** (the first release that speaks OIDC), which
#     needs Node >= 20.17. The job therefore runs a newer Node than the
#     package's floor — see the note on `node-version`.
#   - `setup-node` must NOT be given a `registry-url`. That writes an
#     .npmrc line `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
#     and with the variable unset npm sends the literal string as a token
#     on every call.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.7.0)"
        required: true
        type: string

permissions:
  contents: read
  # Both the identity npm authenticates against and the signer of the
  # provenance statement. Without it, `npm publish` has no way to prove it
  # is this workflow.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # Not the package's floor (18). npm >= 11.5.1 is what speaks
          # OIDC, and it needs Node >= 20.17. Building on a newer engine
          # does not change the artifact: tsup pins `target: "node18"`
          # explicitly for both entries, so the output is the same bytes
          # whichever Node runs the build. Node 18 support is proven by the
          # CI matrix, which still runs the suite there.
          node-version: 22
          cache: npm
          # Deliberately no `registry-url` — see the header.

      # Assert rather than assume. `npm install -g` can fail without taking
      # the step down, and falling through to publish with npm 10 produces
      # an authentication error that says nothing about the real cause.
      - name: npm must be new enough to speak OIDC
        shell: bash
        run: |
          npm install -g npm@^11.5.1
          version=$(npm --version)
          echo "npm $version"
          node -e '
            const [maj, min, patch] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} cannot use trusted publishing; need >= 11.5.1`);
              process.exit(1);
            }
          ' "$version"

      # The OIDC token request URL is injected only when `id-token: write`
      # is granted. If someone trims the permissions block, publish would
      # otherwise fail much later with an opaque auth error.
      - name: OIDC must be available to this job
        shell: bash
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "No OIDC token available — is 'id-token: write' still in the" >&2
            echo "permissions block? Trusted publishing cannot work without it." >&2
            exit 1
          fi
          echo "OIDC token endpoint present"

      - run: npm ci

      # There is deliberately no pre-flight auth check here any more.
      #
      # The old one ran `npm whoami`, which proves only that a token is
      # readable — the five failed v0.8.0 attempts all passed it and then
      # died on the write. With trusted publishing there is no ambient
      # identity to interrogate before the publish call, so a check would
      # either be vacuous or would have to attempt the publish itself.
      # The two assertions above cover what is genuinely knowable early:
      # the npm version and the presence of an OIDC token.

      # The version has to come from the manifest, and the tag has to agree
      # with it. Publishing 0.6.0 from a v0.7.0 tag, or the reverse, is the
      # kind of mistake that is unfixable after the fact — npm does not allow
      # republishing a version.
      - name: Tag and manifest versions must agree
        shell: bash
        run: |
          tag="${{ inputs.ref || github.ref_name }}"
          manifest="v$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$manifest"
          test "$tag" = "$manifest"

      # SDK_VERSION lives in a second file and has drifted before (it
      # reported 0.1.0 for two releases). test/version.test.ts pins it, and
      # the full gate below runs that test — this is just an early, legible
      # failure rather than a surprise inside the suite.
      - name: SDK_VERSION must match the manifest
        shell: bash
        run: |
          grep -q "\"$(node -p "require('./package.json').version")\"" src/version.ts

      # Reads the registry directly rather than through `npm view`. The guard
      # has to distinguish "already published" from "the request failed", and
      # `npm view` collapses both into a non-zero exit — which this step would
      # then have to read as "go ahead", i.e. the guard silently stops
      # guarding. curl -f fails the step instead.
      # Asks the registry about one version, not the whole packument. The
      # full document is hundreds of KB, and passing it around as a shell
      # argument dies with "Argument list too long" — whose non-zero exit a
      # naive guard reads as "not published", i.e. it silently stops
      # guarding. A bare status code cannot fail that way, and anything other
      # than 200/404 fails the step instead of being guessed at.
      - name: Refuse to publish a version that already exists
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/kagura-memory/$version")
          case "$code" in
            404) echo "$version is not on the registry yet" ;;
            200) echo "kagura-memory@$version is already published" >&2; exit 1 ;;
            *)   echo "registry answered $code; refusing to guess" >&2; exit 1 ;;
          esac

      - run: npm run typecheck
      - run: npm test
      # Node 18 has no WebCrypto global; the crypto path installs
      # node:crypto's webcrypto itself. See vitest.no-webcrypto.config.ts.
      - run: npm run test:no-webcrypto
      - run: npm run build

      # Zero runtime dependencies is a documented promise, and the optional
      # `age-encryption` peer must never leak into `dependencies`. Checked
      # on the manifest npm is about to publish, before the publish, so the
      # verdict does not depend on how quickly the registry serves the new
      # version afterwards (#54).
      - name: The manifest declares no runtime dependencies
        shell: bash
        run: |
          node -e '
            const deps = require("./package.json").dependencies;
            if (deps && Object.keys(deps).length > 0) {
              console.error("unexpected dependencies: " + JSON.stringify(deps));
              process.exit(1);
            }
            console.log("dependencies: none");
          '

      # `prepublishOnly` re-runs typecheck/test/test:no-webcrypto/build, so
      # the gate above is belt-and-braces — it fails faster and names the
      # failing step.
      #
      # No `env:` block: authentication is the OIDC exchange npm performs
      # itself. `--provenance` stays explicit even though trusted
      # publishing generates it anyway — the flag is what fails the publish
      # if the attestation cannot be produced, rather than quietly shipping
      # a tarball without one.
      #
      # How the publish ended is recorded for the next step as `landed`:
      #
      # - `accepted`: npm exited 0. The registry took the tarball; how long
      #   it then takes to serve it is npm's processing time, not a doubt
      #   about the publish.
      # - `conflict`: npm said "cannot publish over the previously published
      #   versions". On the v0.8.0 publish npm uploaded the tarball at
      #   12:15:39 and then reported exactly that at 12:15:51 — it had
      #   retried internally and collided with its own successful write. So
      #   it is not a failure here, but the run cannot know whether its own
      #   write landed, and the next step must see the version to pass.
      #
      # Every other publish error still fails here — EOTP, 403 and 404
      # included.
      - name: Publish
        id: publish
        shell: bash
        run: |
          set +e
          out=$(npm publish --provenance --access public 2>&1)
          code=$?
          echo "$out"
          set -e
          if [ "$code" -eq 0 ]; then
            echo "landed=accepted" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$out" | grep -qi 'cannot publish over the previously published version'; then
            echo "::notice::npm reported the version as already present; the next step verifies it."
            echo "landed=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      # Reads the registry directly and parses on stdin, not argv (see the
      # guard above). `npm view` is not used here at all: it serves a cache
      # that reported a stale `latest` for minutes after the 0.5.0 publish.
      #
      # npm now takes minutes to serve a version after accepting it: v0.10.0
      # needed more than 150 s for `latest`, and v0.10.1 was not served at
      # all — not even in the packument — until about 11 minutes after
      # `npm publish` returned (#54). No fixed window is safe, so a slow
      # registry is a verdict only when the publish itself was in doubt:
      #
      # 1. The version document, for up to 20 minutes. When it appears, its
      #    version and (empty) dependencies are checked, and a mismatch
      #    fails the run. If it never appears, an `accepted` publish gets a
      #    warning and a `conflict` one fails.
      # 2. The `latest` dist-tag, for up to 5 more minutes once the version
      #    is served; a lagging tag is only ever a warning.
      - name: Confirm the registry agrees
        shell: bash
        env:
          LANDED: ${{ steps.publish.outputs.landed }}
        run: |
          version=$(node -p "require('./package.json').version")
          found=
          for i in $(seq 1 80); do
            code=$(curl -sS -o version.json -w '%{http_code}' \
              "https://registry.npmjs.org/kagura-memory/$version" || true)
            if [ "$code" = 200 ]; then
              node -e '
                const m = JSON.parse(require("fs").readFileSync("version.json", "utf8"));
                console.log("version=" + m.version, "deps=" + JSON.stringify(m.dependencies));
                if (m.version !== process.argv[1]) process.exit(1);
                if (m.dependencies && Object.keys(m.dependencies).length > 0) {
                  console.error("unexpected dependencies: " + JSON.stringify(m.dependencies));
                  process.exit(1);
                }
              ' "$version" || exit 1
              found=1
              break
            fi
            # 404 until the registry serves it; anything else (a 5xx, a
            # failed connection) is worth another look rather than a verdict.
            echo "attempt $i: $version not on the registry yet (HTTP $code)"
            sleep 15
          done
          if [ -z "$found" ]; then
            if [ "$LANDED" = accepted ]; then
              echo "::warning::npm accepted kagura-memory@$version, but the registry did not serve it within 20 minutes. Check https://www.npmjs.com/package/kagura-memory/v/$version before announcing the release."
              exit 0
            fi
            echo "npm did not confirm this run's publish, and the registry did not serve kagura-memory@$version within 20 minutes" >&2
            exit 1
          fi
          echo "published $version"

          for i in $(seq 1 20); do
            latest=$(curl -fsS https://registry.npmjs.org/-/package/kagura-memory/dist-tags \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).latest??"")}catch{console.log("")}})' \
              || true)
            if [ "$latest" = "$version" ]; then
              echo "latest=$latest"
              exit 0
            fi
            echo "latest=${latest:-?}; waiting for $version"
            sleep 15
          done
          echo "::warning::kagura-memory@$version is published, but the latest dist-tag still says ${latest:-?} after 5 minutes. Check https://www.npmjs.com/package/kagura-memory before announcing the release."
