name: Release

# Publishes to npm from CI so a release never depends on someone being at a
# terminal with a live `npm login`. Two triggers:
#
#   - pushing a `v*` tag, the normal path;
#   - `workflow_dispatch` with a version, for a tag that already exists and
#     was not published (which is exactly how v0.7.0 ended up: tagged and
#     released on GitHub, but the local npm token had expired).
#
# Requires one repository secret, `NPM_TOKEN`. It must be an **automation**
# (or granular) token: those bypass the OTP prompt, which a classic token
# with 2FA-on-publish does not, and OTP is not something CI can answer.
# Add it under Settings → Secrets and variables → Actions.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.7.0)"
        required: true
        type: string

permissions:
  contents: read
  # Required for npm provenance — it signs the published tarball with an
  # OIDC token proving it was built from this repo at this commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Job-wide, not just on the publish step. `setup-node` with a
    # `registry-url` writes an .npmrc containing
    # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and npm expands
    # that for *every* command — so with the variable unset, `npm ci` and any
    # other npm call send a literal `${NODE_AUTH_TOKEN}` and can come back
    # 401 on a package that needs no auth at all.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # The lowest version the package claims to support, so the release
          # is built by the oldest engine a consumer might use.
          node-version: 18
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The version has to come from the manifest, and the tag has to agree
      # with it. Publishing 0.6.0 from a v0.7.0 tag, or the reverse, is the
      # kind of mistake that is unfixable after the fact — npm does not allow
      # republishing a version.
      - name: Tag and manifest versions must agree
        shell: bash
        run: |
          tag="${{ inputs.ref || github.ref_name }}"
          manifest="v$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$manifest"
          test "$tag" = "$manifest"

      # SDK_VERSION lives in a second file and has drifted before (it
      # reported 0.1.0 for two releases). test/version.test.ts pins it, and
      # the full gate below runs that test — this is just an early, legible
      # failure rather than a surprise inside the suite.
      - name: SDK_VERSION must match the manifest
        shell: bash
        run: |
          grep -q "\"$(node -p "require('./package.json').version")\"" src/version.ts

      # Reads the registry directly rather than through `npm view`. The guard
      # has to distinguish "already published" from "the request failed", and
      # `npm view` collapses both into a non-zero exit — which this step would
      # then have to read as "go ahead", i.e. the guard silently stops
      # guarding. curl -f fails the step instead.
      # Asks the registry about one version, not the whole packument. The
      # full document is hundreds of KB, and passing it around as a shell
      # argument dies with "Argument list too long" — whose non-zero exit a
      # naive guard reads as "not published", i.e. it silently stops
      # guarding. A bare status code cannot fail that way, and anything other
      # than 200/404 fails the step instead of being guessed at.
      - name: Refuse to publish a version that already exists
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/kagura-memory/$version")
          case "$code" in
            404) echo "$version is not on the registry yet" ;;
            200) echo "kagura-memory@$version is already published" >&2; exit 1 ;;
            *)   echo "registry answered $code; refusing to guess" >&2; exit 1 ;;
          esac

      - run: npm run typecheck
      - run: npm test
      # Node 18 has no WebCrypto global; the crypto path installs
      # node:crypto's webcrypto itself. See vitest.no-webcrypto.config.ts.
      - run: npm run test:no-webcrypto
      - run: npm run build

      # `prepublishOnly` re-runs typecheck/test/test:no-webcrypto/build, so
      # the gate above is belt-and-braces — it fails faster and names the
      # failing step.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Read through the `latest` dist-tag, which is one small manifest, and
      # parse it on stdin rather than through argv (see the guard above).
      # `npm view` is not used here at all: it serves a cache that reported a
      # stale `latest` for minutes after the 0.5.0 publish.
      - name: Confirm the registry agrees
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 10); do
            if curl -fsS https://registry.npmjs.org/kagura-memory/latest > latest.json; then
              node -e '
                const m = JSON.parse(require("fs").readFileSync("latest.json", "utf8"));
                const want = process.argv[1];
                console.log("latest=" + m.version, "deps=" + JSON.stringify(m.dependencies));
                if (m.version !== want) process.exit(2);
                // Zero runtime dependencies is a documented promise; the
                // optional peer must not have leaked into `dependencies`.
                if (m.dependencies && Object.keys(m.dependencies).length > 0) {
                  console.error("unexpected dependencies: " + JSON.stringify(m.dependencies));
                  process.exit(1);
                }
              ' "$version" && { echo "published $version"; exit 0; }
              # exit 2 means "not visible yet" — keep waiting. Anything else
              # is a real failure and must not be retried into a pass.
              test $? -eq 2 || exit 1
            fi
            echo "attempt $i: $version not visible yet"
            sleep 15
          done
          echo "registry did not report $version as latest" >&2
          exit 1
